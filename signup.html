<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Hafiz Kashif Mehmood | QM & PRC-2</title>
<link rel="stylesheet" href="style.css">

<!-- EmailJS SDK Integration -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script type="text/javascript">
  (function(){
    emailjs.init("bAsWom2LrnBMXHWDK");
  })();
</script>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <img src="logo.png" alt="" class="brand-mark">
      <h2>Create your account</h2>
      <p>Sign up to access notes, assignments &amp; mock papers</p>
    </div>

    <div class="auth-alert error" id="su-error"></div>
    <div class="auth-alert success" id="su-success"></div>

    <form id="signup-form">
      <div class="field">
        <label for="su-name">Full name</label>
        <input type="text" id="su-name" placeholder="Your full name" required>
      </div>
      <div class="field">
        <label for="su-email">Email</label>
        <input type="email" id="su-email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="su-password">Password</label>
        <input type="password" id="su-password" placeholder="Create a password (min 6 characters)" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="su-submit">Create Account</button>
    </form>

    <div class="auth-divider">or continue with</div>

    <button type="button" class="btn btn-google btn-block" id="google-signup-btn">
      Sign up with Google
    </button>

    <p class="auth-foot">Already have an account? <a href="index.html">Sign in</a></p>
  </div>
</div>

<script type="module">
  import { auth, googleProvider } from "./firebase-init.js";
  import {
    createUserWithEmailAndPassword,
    updateProfile,
    sendEmailVerification,
    signInWithPopup,
    getAdditionalUserInfo
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const errorBox = document.getElementById('su-error');
  const successBox = document.getElementById('su-success');
  const submitBtn = document.getElementById('su-submit');

  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.add('show');
  }

  // Direct Form Registration
  document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = "Creating account...";
    const name = document.getElementById('su-name').value.trim();
    const email = document.getElementById('su-email').value.trim();
    const password = document.getElementById('su-password').value;
    
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await updateProfile(cred.user, { displayName: name });
      await sendEmailVerification(cred.user);

      // Trigger Welcome EmailJS
      try {
        await emailjs.send('service_1f5zg2k', 'template_jvp3n48', { to_name: name, email: email });
      } catch (emailErr) {
        console.error("EmailJS error:", emailErr);
      }

      // On-screen message for NEW account
      successBox.textContent = `Welcome, ${name}! Your account was created successfully. Redirecting...`;
      successBox.classList.add('show');
      submitBtn.textContent = "Account created ✓";
      setTimeout(() => { window.location.href = "notes.html"; }, 2000);
    } catch (err) {
      showError(friendlyError(err.code));
      submitBtn.disabled = false;
      submitBtn.textContent = "Create Account";
    }
  });

  // Google Sign-Up / Sign-In
  document.getElementById('google-signup-btn').addEventListener('click', async () => {
    errorBox.classList.remove('show');
    try {
      const cred = await signInWithPopup(auth, googleProvider);
      const details = getAdditionalUserInfo(cred);
      const fullName = cred.user.displayName || "Student";
      const firstName = fullName.split(" ")[0];

      if (details?.isNewUser) {
        // NEW USER: Send email + display welcome message
        try {
          await emailjs.send('service_1f5zg2k', 'template_jvp3n48', { to_name: fullName, email: cred.user.email });
        } catch (emailErr) {
          console.error("EmailJS error:", emailErr);
        }
        successBox.textContent = `Welcome, ${firstName}! Your account is ready — redirecting...`;
      } else {
        // RETURNING USER: Skip email + display welcome back message
        successBox.textContent = `Welcome back, ${firstName}! Redirecting you now...`;
      }

      successBox.classList.add('show');
      setTimeout(() => { window.location.href = "notes.html"; }, 1800);
    } catch (err) {
      showError(friendlyError(err.code));
    }
  });

  function friendlyError(code) {
    const map = {
      "auth/email-already-in-use": "An account with this email already exists. Try signing in instead.",
      "auth/invalid-email": "Please enter a valid email address.",
      "auth/weak-password": "Password should be at least 6 characters."
    };
    return map[code] || ("Something went wrong (" + code + "). Please try again.");
  }
</script>
</body>
</html>
