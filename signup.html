<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="google-site-verification" content="0nJ2K-gkUFOSSXLe8Upb4Qw7xJeTHKVpassFAzrcxlw" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Hafiz Kashif Mehmood | QM & PRC-2</title>
  <link rel="stylesheet" href="style.css">

  <!-- EmailJS SDK Integration -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script type="text/javascript">
    (function(){
      emailjs.init("bAsWom2LrnBMXHWDK");
    })();
  </script>

  <style>
    /* Fullscreen Dedicated Welcome Overlay */
    #fullscreen-welcome {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      z-index: 99999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    #fullscreen-welcome.active {
      display: flex !important;
    }
    .welcome-card {
      max-width: 450px;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      border: 1px solid #e1e8ed;
      background-color: #ffffff;
    }
    .welcome-icon {
      font-size: 50px;
      margin-bottom: 15px;
    }
    .welcome-title {
      font-size: 26px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 12px;
    }
    .welcome-text {
      font-size: 16px;
      color: #4a5568;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<!-- Fullscreen Welcome View -->
<div id="fullscreen-welcome">
  <div class="welcome-card">
    <div class="welcome-icon" id="welcome-icon">👋</div>
    <div class="welcome-title" id="welcome-heading">Welcome Back!</div>
    <p class="welcome-text" id="welcome-subtext">Preparing your dashboard...</p>
  </div>
</div>

<!-- Main Signup Container -->
<div class="auth-wrap" id="main-auth-container">
  <header class="site-header">
    <nav class="nav">
      <a href="index.html" class="brand">
        <img src="logo.png" alt="Logo" class="brand-mark" width="38" height="38">
        <span class="brand-text">
          <span class="brand-name">Hafiz Kashif Mehmood</span>
          <span class="brand-sub">QM &middot; PRC-2 Faculty</span>
        </span>
      </a>
    </nav>
  </header>

  <div class="auth-card">
    <div class="auth-head">
      <img src="logo.png" alt="Logo" class="brand-mark">
      <h2>Create your account</h2>
      <p>Sign up to access notes, assignments &amp; mock papers</p>
    </div>

    <div class="auth-alert error" id="su-error"></div>

    <form id="signup-form">
      <div class="field">
        <label for="su-name">Full name</label>
        <input type="text" id="su-name" placeholder="Your full name" required>
      </div>
      <div class="field">
        <label for="su-email">Email</label>
        <input type="email" id="su-email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="su-password">Password</label>
        <input type="password" id="su-password" placeholder="Create a password (min 6 characters)" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="su-submit">Create Account</button>
    </form>

    <div class="auth-divider">or continue with</div>

    <button type="button" class="btn btn-google btn-block" id="google-signup-btn">
      Sign up with Google
    </button>

    <p class="auth-foot">Already have an account? <a href="signin.html">Sign in</a></p>
  </div>
</div>

<script type="module">
  import { auth, googleProvider } from "./firebase-init.js";
  import {
    createUserWithEmailAndPassword,
    updateProfile,
    sendEmailVerification,
    signInWithPopup,
    getAdditionalUserInfo
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const errorBox = document.getElementById('su-error');
  const submitBtn = document.getElementById('su-submit');
  const mainAuthContainer = document.getElementById('main-auth-container');
  const fullscreenWelcome = document.getElementById('fullscreen-welcome');
  const welcomeIcon = document.getElementById('welcome-icon');
  const welcomeHeading = document.getElementById('welcome-heading');
  const welcomeSubtext = document.getElementById('welcome-subtext');

  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.add('show');
  }

  function showDedicatedWelcome(icon, heading, text) {
    mainAuthContainer.style.display = 'none';
    welcomeIcon.textContent = icon;
    welcomeHeading.textContent = heading;
    welcomeSubtext.textContent = text;
    fullscreenWelcome.classList.add('active');
  }

  // 1. Direct Form Registration (Email/Password)
  document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = "Creating account...";

    const name = document.getElementById('su-name').value.trim();
    const email = document.getElementById('su-email').value.trim();
    const password = document.getElementById('su-password').value;
    
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await updateProfile(cred.user, { displayName: name });
      await sendEmailVerification(cred.user);

      // Trigger EmailJS welcome email for NEW user
      try {
        await emailjs.send('service_1f5zg2k', 'template_jvp3n48', { 
          to_name: name, 
          email: email 
        });
      } catch (emailErr) {
        console.error("EmailJS Error:", emailErr);
      }

      showDedicatedWelcome(
        "🎉", 
        `Welcome, ${name}!`, 
        "Your account has been created successfully. Redirecting to your portal..."
      );

      setTimeout(() => { window.location.href = "notes.html"; }, 2500);
    } catch (err) {
      showError(friendlyError(err.code));
      submitBtn.disabled = false;
      submitBtn.textContent = "Create Account";
    }
  });

  // 2. Google Sign-Up / Sign-In
  document.getElementById('google-signup-btn').addEventListener('click', async () => {
    errorBox.classList.remove('show');

    try {
      const cred = await signInWithPopup(auth, googleProvider);
      const details = getAdditionalUserInfo(cred);
      const fullName = cred.user.displayName || "Student";
      const firstName = fullName.split(" ")[0];

      if (details?.isNewUser) {
        // NEW GOOGLE USER: Send email + Welcome Screen
        try {
          await emailjs.send('service_1f5zg2k', 'template_jvp3n48', { 
            to_name: fullName, 
            email: cred.user.email 
          });
        } catch (emailErr) {
          console.error("EmailJS Error:", emailErr);
        }

        showDedicatedWelcome(
          "🎉", 
          `Welcome, ${firstName}!`, 
          "Your account is ready. Redirecting to your learning portal..."
        );
      } else {
        // EXISTING GOOGLE USER: Display Welcome Back Screen (Identical to Sign-In page)
        showDedicatedWelcome(
          "👋", 
          `Welcome Back, ${firstName}!`, 
          "Redirecting you to your portal dashboard..."
        );
      }

      setTimeout(() => { window.location.href = "notes.html"; }, 2500);
    } catch (err) {
      showError(friendlyError(err.code));
    }
  });

  function friendlyError(code) {
    const map = {
      "auth/email-already-in-use": "An account with this email already exists. Please go to the sign in page to continue.",
      "auth/invalid-email": "Please enter a valid email address.",
      "auth/weak-password": "Password should be at least 6 characters long."
    };
    return map[code] || ("Something went wrong (" + code + "). Please try again.");
  }
</script>
</body>
</html>
