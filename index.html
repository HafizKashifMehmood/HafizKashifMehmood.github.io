<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Hafiz Kashif Mehmood | QM & PRC-2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Header / Nav -->
<header class="site-header">
  <nav class="nav">
    <a href="home.html" class="brand">
      <img src="logo.png" alt="" class="brand-mark" width="38" height="38">
      <span class="brand-text">
        <span class="brand-name">Hafiz Kashif Mehmood</span>
        <span class="brand-sub">QM &middot; PRC-2 Faculty</span>
      </span>
    </a>
  </nav>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <img src="logo.png" alt="" class="brand-mark">
      <h2>Welcome Back</h2>
      <p>Sign in to your account to access course material</p>
    </div>

    <!-- Alert Boxes -->
    <div class="auth-alert error" id="si-error"></div>
    <div class="auth-alert success" id="si-success"></div>

    <form id="signin-form">
      <div class="field">
        <label for="si-email">Email</label>
        <input type="email" id="si-email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="si-password">Password</label>
        <input type="password" id="si-password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="si-submit">Sign In</button>
    </form>

    <div class="auth-divider">or continue with</div>

    <button type="button" class="btn btn-google btn-block" id="google-signin-btn">
      Sign in with Google
    </button>

    <p class="auth-foot">Don't have an account? <a href="signup.html">Sign up</a></p>
  </div>
</div>

<script type="module">
  import { auth, googleProvider } from "./firebase-init.js";
  import {
    signInWithEmailAndPassword,
    signInWithPopup
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const errorBox = document.getElementById('si-error');
  const successBox = document.getElementById('si-success');
  const submitBtn = document.getElementById('si-submit');

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }

  // Email / Password Sign-In
  document.getElementById('signin-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = "Signing in...";

    const email = document.getElementById('si-email').value.trim();
    const password = document.getElementById('si-password').value;

    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      
      // Get display name or fallback to name part of email
      const displayName = cred.user.displayName || email.split('@')[0];
      
      // Display Welcome Back message on screen
      successBox.textContent = `Welcome back, ${displayName}! Redirecting you to your portal...`;
      successBox.classList.add('show');

      setTimeout(() => { window.location.href = "notes.html"; }, 1500);
    } catch (err) {
      showError(friendlyError(err.code));
      submitBtn.disabled = false;
      submitBtn.textContent = "Sign In";
    }
  });

  // Google Sign-In
  document.getElementById('google-signin-btn').addEventListener('click', async () => {
    errorBox.classList.remove('show');
    try {
      const cred = await signInWithPopup(auth, googleProvider);
      const name = cred.user.displayName || "there";

      // Display Welcome Back message on screen
      successBox.textContent = `Welcome back, ${name}! Redirecting you now...`;
      successBox.classList.add('show');

      setTimeout(() => { window.location.href = "notes.html"; }, 1500);
    } catch (err) {
      showError(friendlyError(err.code));
    }
  });

  function friendlyError(code) {
    const map = {
      "auth/invalid-credential": "Invalid email or password. Please check and try again.",
      "auth/user-not-found": "No account found with this email address.",
      "auth/wrong-password": "Incorrect password.",
      "auth/invalid-email": "Please enter a valid email address."
    };
    return map[code] || "Failed to sign in. Please try again.";
  }
</script>
</body>
</html>
