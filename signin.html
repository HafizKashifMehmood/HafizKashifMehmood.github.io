<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="google-site-verification" content="0nJ2K-gkUFOSSXLe8Upb4Qw7xJeTHKVpassFAzrcxlw" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Hafiz Kashif Mehmood | QM & PRC-2</title>
  <meta name="description" content="Sign in to access course notes, assignments, and mock papers by Hafiz Kashif Mehmood, SKANS School of Accountancy, Multan.">
  <meta name="robots" content="noindex">
  <meta name="author" content="Hafiz Kashif Mehmood">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">

  <style>
    /* Fullscreen Dedicated Welcome Overlay */
    #fullscreen-welcome {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      z-index: 99999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    #fullscreen-welcome.active {
      display: flex !important;
    }
    .welcome-card {
      max-width: 450px;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      border: 1px solid #e1e8ed;
      background-color: #ffffff;
    }
    .welcome-icon {
      font-size: 50px;
      margin-bottom: 15px;
    }
    .welcome-title {
      font-size: 26px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 12px;
    }
    .welcome-text {
      font-size: 16px;
      color: #4a5568;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<!-- Fullscreen Welcome View -->
<div id="fullscreen-welcome">
  <div class="welcome-card">
    <div class="welcome-icon">👋</div>
    <div class="welcome-title" id="welcome-heading">Welcome Back!</div>
    <p class="welcome-text" id="welcome-subtext">Preparing your dashboard...</p>
  </div>
</div>

<!-- Main Sign In Container -->
<div class="auth-wrap" id="main-auth-container">
  <header class="site-header">
    <nav class="nav">
      <a href="index.html" class="brand">
        <img src="logo.png" alt="" class="brand-mark" width="38" height="38">
        <span class="brand-text">
          <span class="brand-name">Hafiz Kashif Mehmood</span>
          <span class="brand-sub">QM &middot; PRC-2 Faculty</span>
        </span>
      </a>
    </nav>
  </header>

  <div class="auth-card">
    <div class="auth-head">
      <img src="logo.png" alt="" class="brand-mark">
      <h2>Welcome Back</h2>
      <p>Sign in to your account to access course material</p>
    </div>

    <div class="auth-alert error" id="si-error"></div>

    <form id="signin-form">
      <div class="field">
        <label for="si-email">Email</label>
        <input type="email" id="si-email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="si-password">Password</label>
        <input type="password" id="si-password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="si-submit">Sign In</button>
    </form>

    <div class="auth-divider">or continue with</div>

    <button type="button" class="btn btn-google btn-block" id="google-signin-btn">
      Sign in with Google
    </button>

    <p class="auth-foot">Don't have an account? <a href="signup.html">Sign up</a></p>
  </div>
</div>

<script type="module">
  import { auth, googleProvider } from "./firebase-init.js";
  import {
    signInWithEmailAndPassword,
    signInWithPopup,
    getAdditionalUserInfo,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const errorBox = document.getElementById('si-error');
  const submitBtn = document.getElementById('si-submit');
  const mainAuthContainer = document.getElementById('main-auth-container');
  const fullscreenWelcome = document.getElementById('fullscreen-welcome');
  const welcomeHeading = document.getElementById('welcome-heading');
  const welcomeSubtext = document.getElementById('welcome-subtext');

  const noAccountMsg = "You don't have an account yet. Please sign up first on the Sign Up page.";

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }

  function showDedicatedWelcome(heading, text) {
    mainAuthContainer.style.display = 'none';
    welcomeHeading.textContent = heading;
    welcomeSubtext.textContent = text;
    fullscreenWelcome.classList.add('active');
  }

  // 1. Email / Password Sign-In (existing accounts only)
  document.getElementById('signin-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');

    submitBtn.disabled = true;
    submitBtn.textContent = "Signing in...";

    const email = document.getElementById('si-email').value.trim();
    const password = document.getElementById('si-password').value;

    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);

      const displayName = cred.user.displayName || email.split('@')[0];
      const firstName = displayName.split(' ')[0];

      showDedicatedWelcome(
        `Welcome Back, ${firstName}!`,
        "Redirecting you to your portal dashboard..."
      );

      setTimeout(() => { window.location.href = "notes.html"; }, 2500);
    } catch (err) {
      showError(friendlyError(err.code));
      submitBtn.disabled = false;
      submitBtn.textContent = "Sign In";
    }
  });

  // 2. Google Sign-In — existing accounts only (new users must use Sign Up)
  document.getElementById('google-signin-btn').addEventListener('click', async () => {
    errorBox.classList.remove('show');

    try {
      const cred = await signInWithPopup(auth, googleProvider);
      const details = getAdditionalUserInfo(cred);

      // If this Google account is new, do not keep them signed in
      if (details?.isNewUser) {
        try {
          await cred.user.delete();
        } catch (delErr) {
          await signOut(auth);
        }
        showError(noAccountMsg + " Use the Sign Up page to create your account.");
        return;
      }

      const fullName = cred.user.displayName || "there";
      const firstName = fullName.split(' ')[0];

      showDedicatedWelcome(
        `Welcome Back, ${firstName}!`,
        "Redirecting you to your portal dashboard..."
      );

      setTimeout(() => { window.location.href = "notes.html"; }, 2500);
    } catch (err) {
      if (err.code === "auth/popup-closed-by-user") return;
      showError(friendlyError(err.code));
    }
  });

  function friendlyError(code) {
    const map = {
      "auth/invalid-credential": noAccountMsg + " If you already registered, check your email and password.",
      "auth/user-not-found": noAccountMsg,
      "auth/wrong-password": "Incorrect password. Please try again.",
      "auth/invalid-email": "Please enter a valid email address.",
      "auth/too-many-requests": "Too many attempts. Please try again later."
    };
    return map[code] || "Failed to sign in. Please try again, or create an account on the Sign Up page.";
  }
</script>
</body>
</html>
